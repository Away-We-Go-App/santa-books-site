<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f0db">
    <meta name="description" content="Make Christmas Magic Last Forever with Santa Books.">
    <title>Santa Books — Make Christmas Magic Last Forever</title>
    <link rel="icon" href="assets/wordmark.svg" type="image/svg+xml">
    <link rel="preload" href="assets/eb-garamond.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/assets/christmas-motion/tree.webp" as="image">
    <link rel="preload" href="/assets/christmas-motion/walk-views.webp" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="homepage">
    <canvas id="homepage-snow" aria-hidden="true"></canvas>
    <header class="brand">
      <img src="assets/wordmark.svg" width="200" height="34" alt="Santa Books">
    </header>
    <main>
      <h1>Make Christmas <br>Magic Last Forever</h1>
      <!-- Replace this span with an anchor when Santa Books has a store URL.
           Keep the badge's accessible name and remove aria-disabled. -->
      <span class="app-store" aria-disabled="true">
        <img src="assets/app-store-badge.svg" width="180" height="60"
             alt="Download on the App Store — link coming soon">
      </span>
      <div class="christmas-stage">
        <img class="christmas-art" src="assets/christmas-motion/poster.webp"
             width="2000" height="1280" fetchpriority="high"
             alt="A handmade clay Christmas tree with golden stars beside a reindeer in a red scarf">
        <canvas id="christmas-scene" width="2000" height="1280" role="img"
                aria-label="A clay reindeer in a red scarf walks beside a handmade clay Christmas tree with golden stars, glances up, and the tree gently bows hello"></canvas>
      </div>
    </main>
    <footer class="site-footer">
      <nav aria-label="Footer">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/support">Support</a>
      </nav>
      <p>© 2026 Santa Books</p>
    </footer>
    <script src="/home-motion.js" defer></script>
  </body>
</html>
